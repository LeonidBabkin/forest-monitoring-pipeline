aoi:
  lon_min: 6.5
  lat_min: 49.7
  lon_max: 6.7
  lat_max: 49.8

scsc:
  target_bands: ['B4', 'B8', 'B12']
  ndvi_threshold: 0.35
  slope_threshold_deg: 5.0
  min_valid_pixels: 50
  regression_scale_m: 10
  regression_max_pixels: 100000000
  acceptance_scale_m: 10
  acceptance_samples: 100
  acceptance_seed: 42
  c_default: 0.5
  c_min: 0.0
  c_max: 5.0
  r_threshold: 0.1
  p_threshold: 0.05

dem:
  slope_unit: 'radians'
  slope_asset: 'projects/ee-learning-trier/assets/dem_srtm_30m'
  aspect_asset: 'projects/ee-learning-trier/assets/dem_srtm_30m'